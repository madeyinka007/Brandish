# Amplify build spec.
#
# THIS FILE MUST LIVE AT THE REPOSITORY ROOT. Amplify only reads `amplify.yml` from the root of
# the repo — it was previously at web/amplify.yml, where Amplify never saw it, so the app fell
# back to the auto-generated console build spec (no build commands, baseDirectory `/`) and
# published the raw repo files as a static site. That is why the live URL 404'd.
version: 1
applications:
  # `appRoot: web` is what tells Amplify this is a monorepo and that the Next.js app lives in
  # web/, not at the repository root. Set the app's "monorepo app root" to `web` in the Amplify
  # console to match — the two settings work together.
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            # Same gate .github/workflows/amplify-build.yml runs on pull requests. Note that
            # web's `npm test` is currently a stub (there are no unit tests yet), so today the
            # build step below is the real check.
            - npm test
        build:
          commands:
            - npm run build
      artifacts:
        # Next.js App Router with SSR/ISR routes (/[category], /[category]/[slug], the admin
        # edit pages) — Amplify reads .next and deploys to its compute platform. Do NOT change
        # this to `out`; the app is not a static export.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
